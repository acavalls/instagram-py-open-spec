{% for post in posts %}
  {% include "web/_post_card.html" %}
{% endfor %}

{% if has_next %}
<div
  hx-get="{% url 'web:index' %}?page={{ next_page }}"
  hx-trigger="revealed"
  hx-swap="beforeend"
  hx-target="#feed-posts"
  hx-indicator="this"
  class="infinite-scroll-sentinel"
>
  <div class="infinite-scroll-loader htmx-indicator">
    <div class="spinner"></div>
  </div>
</div>
{% else %}
<div class="infinite-scroll-end">No more posts</div>
{% endif %}
