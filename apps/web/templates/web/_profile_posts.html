{% for post in posts %}
  <div class="profile-grid__item-wrapper">
    <a href="#" class="profile-grid__item">
      {% if post.media.all %}
        <img src="{{ post.media.all.0.file.url }}" alt="{{ post.caption }}">
      {% else %}
        <div class="profile-grid__placeholder">
          <i class="bi bi-image"></i>
        </div>
      {% endif %}
      <div class="profile-grid__overlay">
        <span><i class="bi bi-heart-fill"></i> 0</span>
        <span><i class="bi bi-chat-fill"></i> 0</span>
      </div>
    </a>
    {% if is_own_profile %}
      <div class="profile-post-menu-wrapper">
        <button
          class="profile-grid__menu-btn"
          title="Menu"
          onclick="this.closest('.profile-grid__item-wrapper').querySelector('.post-card__menu').classList.toggle('hidden')"
        >&middot;&middot;&middot;</button>
        <div class="post-card__menu hidden">
          <button
            class="post-card__menu-item"
            hx-get="{% url 'web:get_edit_form' post.id %}"
            hx-target="#edit-form-{{ post.id }}"
            hx-swap="outerHTML"
          >Edit</button>
          <form
            hx-post="{% url 'web:delete_post' post.id %}"
            hx-target="closest .profile-grid__item-wrapper"
            hx-swap="outerHTML"
          >
            {% csrf_token %}
            <button type="submit" class="post-card__menu-item">Delete</button>
          </form>
        </div>
      </div>
      <div class="post-card__edit-form-wrapper hidden" id="edit-form-{{ post.id }}"></div>
    {% endif %}
  </div>
{% endfor %}

{% if has_next %}
<div
  hx-get="{% url 'web:profile' profile_user.id %}?page={{ next_page }}"
  hx-trigger="revealed"
  hx-swap="beforeend"
  hx-target="#profile-posts"
  hx-indicator="this"
  class="infinite-scroll-sentinel"
>
  <div class="infinite-scroll-loader htmx-indicator">
    <div class="spinner"></div>
  </div>
</div>
{% else %}
<div class="infinite-scroll-end">No more posts</div>
{% endif %}
