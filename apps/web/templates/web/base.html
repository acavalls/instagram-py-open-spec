{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Instagram{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'web/css/web.css' %}">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body class="app-layout">
  <aside class="sidebar">
    <a href="{% url 'web:index' %}" class="sidebar__logo">Instagram</a>
    <nav class="sidebar__nav">
      <a href="{% url 'web:index' %}" class="sidebar__link {% if request.resolver_match.url_name == 'index' %}sidebar__link--active{% endif %}">
        <i class="bi bi-house-door"></i>
        <span>Home</span>
      </a>
      <a href="#" class="sidebar__link">
        <i class="bi bi-search"></i>
        <span>Search</span>
      </a>
      <a href="#" class="sidebar__link">
        <i class="bi bi-compass"></i>
        <span>Explore</span>
      </a>
      <a href="#" class="sidebar__link">
        <i class="bi bi-messenger"></i>
        <span>Messages</span>
      </a>
      <a href="#" class="sidebar__link">
        <i class="bi bi-heart"></i>
        <span>Notifications</span>
      </a>
      <form
        hx-post="{% url 'web:create_random_post' %}"
        hx-target="#messages"
        hx-swap="innerHTML"
      >
        {% csrf_token %}
        <button type="submit" class="sidebar__link">
          <i class="bi bi-plus-square"></i>
          <span>Create</span>
        </button>
      </form>
      <a href="{% url 'web:profile' user.id %}" class="sidebar__link {% if request.resolver_match.url_name == 'profile' %}sidebar__link--active{% endif %}">
        <i class="bi bi-person-circle"></i>
        <span>Profile</span>
      </a>
    </nav>
    <div class="sidebar__bottom">
      <form action="{% url 'web:logout' %}" method="post" class="sidebar__logout">
        {% csrf_token %}
        <button type="submit" class="sidebar__link sidebar__logout-btn">
          <i class="bi bi-box-arrow-right"></i>
          <span>Log out</span>
        </button>
      </form>
    </div>
  </aside>

  <main class="main-content">
    <div id="messages">
      {% include "web/_messages.html" %}
    </div>
    {% block content %}{% endblock %}
  </main>

  <div id="modal-container"></div>
</body>
</html>
