{% extends "web/base_auth.html" %}

{% block title %}Log in · Instagram{% endblock %}

{% block content %}
<div class="auth-card">
  <h1 class="auth-logo">Instagram</h1>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post" action="{% url 'web:login' %}" class="auth-form">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username" required autofocus>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="btn-primary">Log in</button>
  </form>
</div>
<div class="auth-card auth-card--secondary">
  <p class="auth-switch">
    Don't have an account? <a href="{% url 'web:register' %}">Sign up</a>
  </p>
</div>
{% endblock %}
